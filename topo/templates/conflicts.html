{% extends "base.html" %}
{% block title %}Conflicts{% endblock %}
{% block head %}
<style>
pre { font-size: 11px; color: var(--text-dim); background: var(--bg-code); padding: 8px; overflow-x: auto; margin-top: 6px; }
form.inline { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
form.inline input[type=text] { width: 120px; }
.msg { font-size: 11px; margin-top: 6px; }
</style>
{% endblock %}
{% block content %}
<div class="container stack" id="list">
    <div class="empty">loading...</div>
</div>
{% endblock %}
{% block scripts %}
<script>
function esc(s) {
    var d = document.createElement('div');
    d.textContent = s === null || s === undefined ? '' : String(s);
    return d.innerHTML;
}

function mergeConflict(conflictId, ids, btn) {
    var form = btn.closest('form');
    var survivor = form.survivor.value.trim();
    var loser = form.loser.value.trim();
    var msg = form.querySelector('.msg');
    if (!survivor || !loser) {
        msg.textContent = 'enter both device ids from: ' + ids;
        msg.className = 'msg err';
        return;
    }
    fetch('/api/devices/' + survivor + '/merge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ loser_id: parseInt(loser, 10) }),
    }).then(function (r) {
        return r.json().then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (result) {
        if (result.ok) {
            msg.textContent = 'merged ' + loser + ' into ' + survivor;
            msg.className = 'msg ok';
            load();
        } else {
            msg.textContent = result.data.error || 'failed';
            msg.className = 'msg err';
        }
    });
}

function dismissConflict(conflictId, btn) {
    if (!confirm('Dismiss conflict #' + conflictId + '? It is marked resolved without merging anything.')) { return; }
    var msg = btn.closest('form').querySelector('.msg');
    fetch('/api/conflicts/' + conflictId + '/dismiss', { method: 'POST' }).then(function (r) {
        if (r.ok) { load(); return; }
        return r.json().then(function (data) {
            msg.textContent = data.error || 'failed';
            msg.className = 'msg err';
        });
    });
}

var conflictList = [];
function render(list) {
    conflictList = list;
    var el = document.getElementById('list');
    if (!list.length) {
        el.innerHTML = '<div class="empty">no unresolved conflicts</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
        var c = list[i];
        html += '<div class="section" data-ctx="conflict" data-id="' + ctxMenu.attr(c.id) + '">' +
            '<div class="section-header"><span>conflict #' + c.id + ' — ' + esc(c.source) + '</span></div>' +
            '<div class="section-body">' +
            '<div class="kv"><span class="k">seen</span><span>' + esc(c.seen_at) + '</span></div>' +
            '<div class="kv"><span class="k">matched device ids</span><span>' + esc(c.device_ids) + '</span></div>' +
            '<div class="kv"><span class="k">detail</span><span>' + esc(c.detail) + '</span></div>' +
            '<pre>' + esc(c.candidate) + '</pre>' +
            '<form class="inline" onsubmit="return false;">' +
            '<input type="text" name="survivor" placeholder="survivor id">' +
            '<input type="text" name="loser" placeholder="loser id">' +
            '<button type="button" onclick="mergeConflict(' + c.id + ', \'' + esc(c.device_ids) + '\', this)">Merge</button>' +
            '<button type="button" onclick="dismissConflict(' + c.id + ', this)" title="Mark resolved without merging — e.g. a single-device conflict you have checked">Dismiss</button>' +
            '<span class="msg"></span>' +
            '</form>' +
            '</div></div>';
    }
    el.innerHTML = html;
}

function load() {
    fetch('/api/conflicts').then(function (r) { return r.json(); }).then(render);
}

// Right-click menus (static/ctxmenu.js). The card is looked up by id when the menu opens.
ctxMenu.register('conflict', function (card) {
    var id = parseInt(card.getAttribute('data-id'), 10);
    var c = conflictList.filter(function (x) { return x.id === id; })[0];
    if (!c) { return null; }
    var items = String(c.device_ids || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean).map(function (did) {
        return { label: 'Open device ' + did, action: function () { window.location.href = '/devices/' + did; } };
    });
    items.push({ label: 'Copy device ids', action: function () { ctxMenu.copy(String(c.device_ids || '')); } });
    items.push({ label: 'Copy detail', action: function () { ctxMenu.copy(c.detail || ''); } });
    items.push({ label: 'Copy candidate', action: function () { ctxMenu.copy(c.candidate || ''); } });
    // The card's own Dismiss button asks first (dismissConflict).
    items.push({ label: 'Dismiss conflict', danger: true, action: function () {
        var b = card.querySelector('button[title^="Mark resolved"]');
        if (b) { b.click(); }
    } });
    return { title: 'Conflict #' + c.id, items: items };
});

// Empty page space; the header, nav and taskbar keep the browser's own menu.
document.documentElement.setAttribute('data-ctx', 'page');
ctxMenu.register('page', function (el, ev) {
    if (ev.target.closest('.header, .side-nav, .taskbar, .dos-menubar, .dos-fkeys, .dos-help, .page-footer')) { return null; }
    return { title: 'Conflicts', items: [
        { label: 'Refresh', action: load },
        { label: 'Devices', action: function () { window.location.href = '/devices'; } },
    ] };
});

load();
</script>
{% endblock %}
