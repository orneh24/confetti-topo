{% extends "base.html" %}
{% block title %}Recent changes{% endblock %}
{% block head %}
<style>
.chg-filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
.chg-filters label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--text-dim); }
.chg-filters input[type=search] { min-width: 200px; }
/* Summary tiles over the filtered rows: one coloured edge each, theme variables only. */
.chg-tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chg-tile { flex: 0 0 150px; background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
    border-left: 4px solid var(--tile, var(--gray)); padding: 5px 10px; }
.chg-tile .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
.chg-tile .v { font-size: 18px; font-weight: 600; line-height: 1.4; }
.chg-tile .plus { color: var(--green); }
.chg-tile .minus { color: var(--red); }
.changes-wrap { display: flex; gap: 12px; align-items: flex-start; }
.changes-wrap .section { flex: 1 1 auto; min-width: 0; }
tr.row { cursor: pointer; }
tr.band td { background: color-mix(in srgb, var(--stripe), var(--text) 8%); }
tr.devstart td { border-top: 2px solid var(--border); }
tbody tr.selected td { background: var(--yellow-bg); font-weight: bold; box-shadow: inset 0 2px 0 var(--blue), inset 0 -2px 0 var(--blue); }
tbody tr.selected td:first-child { box-shadow: inset 4px 0 0 var(--blue), inset 0 2px 0 var(--blue), inset 0 -2px 0 var(--blue); }
td.when { white-space: nowrap; }
td.notes .pill { margin-right: 4px; }
/* Before / After: a state word is coloured by what it means - green good, yellow warning, red bad. */
.st { display: inline-block; padding: 0 7px; border-radius: 10px; border: 1px solid currentColor; font-weight: bold; }
.st-ok { color: var(--green); background: var(--green-bg); }
.st-warn { color: var(--yellow); background: var(--yellow-bg); }
.st-bad { color: var(--red); background: var(--red-bg); }
.st-na { color: var(--text-dim); }
:root .linklike { display: inline; background: none; border: 0; box-shadow: none; transform: none; border-radius: 0;
    padding: 0; margin: 0; font: inherit; text-transform: none; text-shadow: none; color: var(--blue); text-decoration: underline; cursor: pointer; text-align: left; }
:root .linklike:hover { background: none; color: var(--text); }
.filter-note { font-weight: normal; }
/* Click a row: this pane shows the whole event. */
.event-pane { position: relative; flex: none; width: 300px; display: none; font-size: 12px; color: var(--text);
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; }
.event-pane h3 { margin: 0 24px 2px 0; font-size: 14px; word-break: break-word; }
.event-pane .close { position: absolute; top: 6px; right: 8px; padding: 0 6px; }
.event-pane .sub { color: var(--text-dim); margin-bottom: 6px; }
.event-pane .kv-row { display: flex; gap: 8px; padding: 1px 0; }
.event-pane .kv-row .k { flex: 0 0 76px; color: var(--text-dim); }
.event-pane .kv-row .v { word-break: break-word; }
.event-pane h4 { margin: 8px 0 3px; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
.event-pane .detail { white-space: pre-wrap; word-break: break-word; }
.event-pane .actions { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 800px) {
    .changes-wrap { flex-direction: column; }
    .event-pane { width: auto; align-self: stretch; }
}
</style>
{% endblock %}
{% block content %}
<div class="container stack">
    <div class="section">
        <div class="section-header"><span>Recent changes</span><span class="filter-note" id="count-note"></span></div>
        <div class="section-body">
            <div class="chg-filters">
                <label>Window
                    <select id="f-hours">
                        <option value="1">last hour</option>
                        <option value="6">last 6 hours</option>
                        <option value="24" selected>last 24 hours</option>
                        <option value="168">last 7 days</option>
                        <option value="720">last 30 days</option>
                    </select></label>
                <label>Device <select id="f-device"><option value="">All</option></select></label>
                <label>Type <select id="f-type"><option value="">All</option></select></label>
                <label>Change <select id="f-change"><option value="">All</option></select></label>
                <label>Severity <select id="f-severity"><option value="">All</option></select></label>
                <label>Search <input type="search" id="f-q" placeholder="device, interface, peer, value"></label>
                <button type="button" class="linklike" onclick="resetFilters()">reset filters</button>
                <button type="button" class="linklike" onclick="exportCsv()" title="Download the events shown now as a CSV file">export CSV</button>
            </div>
            <div class="chg-tiles" id="tiles"></div>
        </div>
    </div>
    <div class="changes-wrap">
        <div class="section">
            <div class="section-body">
                <table data-sortable id="table">
                    <thead><tr><th>Time (since last change)</th><th>Device</th><th>Type</th><th>Change</th>
                        <th>Subject</th><th>Before</th><th>After</th><th>Notes</th></tr></thead>
                    <tbody id="rows"></tbody>
                </table>
                <div class="empty" id="empty" style="display:none">no changes match</div>
            </div>
        </div>
        <div class="event-pane" id="pane" role="dialog" aria-label="Event details">
            <button type="button" class="close" onclick="closePane()" aria-label="Close">&times;</button>
            <h3 id="ep-title"></h3>
            <div class="sub" id="ep-sub"></div>
            <div id="ep-info"></div>
            <h4>Detail</h4>
            <div class="detail" id="ep-detail"></div>
            <div class="actions">
                <button type="button" id="ep-device" onclick="openDevice(selectedEvent())">Open device page</button>
                <button type="button" id="ep-topo" onclick="openTopology(selectedEvent())">Show on topology</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
var events = [];          // newest first; type/change/item/before/after come from the API (events.describe)
var gaps = {};            // event id -> ms since the same device's previous change (null = none loaded)
var selectedId = null;

function esc(s) {
    var d = document.createElement('div');
    d.textContent = s === null || s === undefined ? '' : String(s);
    return d.innerHTML;
}

function pad(n) { return (n < 10 ? '0' : '') + n; }

// 45 s, 23 min, 2 h, 3 days.
function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) { return s + ' s'; }
    if (s < 3600) { return Math.floor(s / 60) + ' min'; }
    if (s < 86400) { return Math.floor(s / 3600) + ' h'; }
    var d = Math.floor(s / 86400);
    return d + (d === 1 ? ' day' : ' days');
}

var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// "14:32:05 (23 min)" today, "19 Oct 14:32:05 (2 h)" on another day. The bracket is the gap to that device's previous change.
function timeCell(e) {
    var d = new Date(e.at);
    var text = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    if (d.toDateString() !== new Date().toDateString()) { text = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + text; }
    var gap = gaps[e.id];
    return gap === null || gap === undefined ? text : text + ' (' + ago(gap) + ')';
}

function sevClass(sev) { return sev === 'info' ? 'ok' : (sev === 'warning' ? 'running' : 'bad'); }
function changeClass(c) { return c === 'added' ? 'ok' : (c === 'removed' ? 'bad' : (c === 'changed' ? 'running' : 'idle')); }

// A Before / After value as a coloured word when it is a known state (BGP, OSPF, interface, ping, polling), else plain text.
var STATE_OK = ['established', 'full', 'up', 'ok', 'answering'];
var STATE_WARN = ['idle', 'idle (admin)', 'active', 'connect', 'opensent', 'openconfirm', 'init', 'attempt', '2way', '2-way',
                  'exstart', 'exchange', 'loading', 'down (admin)'];
var STATE_BAD = ['down', 'failing', 'not answering'];
function stateCell(v) {
    if (!v) { return ''; }
    var k = String(v).toLowerCase().trim();
    var cls = STATE_OK.indexOf(k) !== -1 ? 'st-ok' : STATE_WARN.indexOf(k) !== -1 ? 'st-warn'
            : STATE_BAD.indexOf(k) !== -1 ? 'st-bad' : k === 'n/a' ? 'st-na' : '';
    return cls ? '<span class="st ' + cls + '">' + esc(v) + '</span>' : esc(v);
}

function deviceName(e) { return e.hostname || (e.device_id ? 'device ' + e.device_id : '-'); }

// What the row is about: the API's item, else the subject without the device name in front.
function subjectText(e) {
    if (e.item) { return e.item; }
    var s = e.subject || '';
    if (e.hostname && s.indexOf(e.hostname) === 0) { s = s.slice(e.hostname.length).replace(/^[ :]+/, ''); }
    return s;
}

// The detail's first line, unless it is the "a -> b" already shown as before/after.
function noteText(e) {
    var d = e.detail || '';
    if (e.before && e.after && d === e.before + ' -> ' + e.after) { return ''; }
    var lines = d.split('\n');
    return lines[0] + (lines.length > 1 ? ' …' : '');
}

function findEvent(id) {
    for (var i = 0; i < events.length; i++) { if (events[i].id === id) { return events[i]; } }
    return null;
}

function selectedEvent() { return findEvent(selectedId); }

function computeGaps() {
    gaps = {};
    var last = {};   // device id -> time of its previous (older) change
    for (var i = events.length - 1; i >= 0; i--) {
        var e = events[i];
        var t = new Date(e.at).getTime();
        gaps[e.id] = e.device_id !== null && last[e.device_id] !== undefined ? t - last[e.device_id] : null;
        if (e.device_id !== null) { last[e.device_id] = t; }
    }
}

// ---- Filters --------------------------------------------------------------------
function val(id) { return document.getElementById(id).value; }

// Refill a select from the loaded rows and keep what was chosen, even if it has no rows now.
function fillSelect(id, pairs) {
    var sel = document.getElementById(id);
    var keep = sel.value;
    while (sel.options.length > 1) { sel.remove(1); }
    pairs.sort(function (a, b) { return a[1].localeCompare(b[1], undefined, { numeric: true }); });
    var found = false;
    pairs.forEach(function (p) {
        var o = document.createElement('option');
        o.value = p[0]; o.textContent = p[1];
        sel.appendChild(o);
        if (p[0] === keep) { found = true; }
    });
    if (keep && !found) {
        var o = document.createElement('option');
        o.value = keep; o.textContent = keep;
        sel.appendChild(o);
    }
    sel.value = keep;
}

function fillFilters() {
    var dev = {}, type = {}, change = {}, sev = {};
    events.forEach(function (e) {
        if (e.device_id !== null) { dev[String(e.device_id)] = deviceName(e); }
        type[e.type] = e.type;
        if (e.change) { change[e.change] = e.change; }
        sev[e.severity] = e.severity;
    });
    function pairs(o) { return Object.keys(o).map(function (k) { return [k, o[k]]; }); }
    fillSelect('f-device', pairs(dev));
    fillSelect('f-type', pairs(type));
    fillSelect('f-change', pairs(change));
    fillSelect('f-severity', pairs(sev));
}

function visibleEvents() {
    var dev = val('f-device'), type = val('f-type'), change = val('f-change'), sev = val('f-severity');
    var q = val('f-q').trim().toLowerCase();
    return events.filter(function (e) {
        if (dev && String(e.device_id) !== dev) { return false; }
        if (type && e.type !== type) { return false; }
        if (change && e.change !== change) { return false; }
        if (sev && e.severity !== sev) { return false; }
        if (q) {
            var hay = [deviceName(e), e.type, e.subject, e.item, e.before, e.after, e.detail].join(' ').toLowerCase();
            if (hay.indexOf(q) < 0) { return false; }
        }
        return true;
    });
}

function setDeviceFilter(id) { document.getElementById('f-device').value = id === null ? '' : String(id); render(); }

// The events shown now (filters applied) as a CSV file. A cell that starts with = + - or @ gets a leading ' so a
// spreadsheet does not run it as a formula.
function exportCsv() {
    function cell(v) {
        v = v === null || v === undefined ? '' : String(v);
        if (/^[=+\-@\t\r]/.test(v)) { v = "'" + v; }
        return '"' + v.replace(/"/g, '""') + '"';
    }
    var head = ['time', 'device', 'severity', 'type', 'change', 'item', 'before', 'after', 'detail'];
    var lines = [head.join(',')];
    visibleEvents().forEach(function (e) {
        lines.push([e.at, deviceName(e), e.severity, e.type, e.change, e.item, e.before, e.after, e.detail].map(cell).join(','));
    });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n') + '\r\n'], { type: 'text/csv' }));
    a.download = 'confetti-topo-events.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

function resetFilters() {
    ['f-device', 'f-type', 'f-change', 'f-severity', 'f-q'].forEach(function (id) { document.getElementById(id).value = ''; });
    if (val('f-hours') !== '24') { document.getElementById('f-hours').value = '24'; load(); } else { render(); }
}

// ---- Summary tiles --------------------------------------------------------------
function plusMinus(p, m) {
    return '<span class="plus">+' + p + '</span> <span class="minus">&minus;' + m + '</span>';
}

function count(list, fn) { return list.filter(fn).length; }

function renderTiles(list) {
    var rp = 0, rm = 0;
    list.forEach(function (e) {
        var m = e.kind === 'routes_changed' && /^\+(\d+) -(\d+)$/.exec(e.item || '');
        if (m) { rp += +m[1]; rm += +m[2]; }
    });
    // A peer is down when its newest state event in view is a warning (the list is newest first).
    var seen = {}, peersDown = 0;
    list.forEach(function (e) {
        if (!/^(bgp|ospf)_/.test(e.kind)) { return; }
        var key = e.device_id + '|' + e.type + '|' + e.item;
        if (seen[key]) { return; }
        seen[key] = true;
        if (/_state$/.test(e.kind) && e.severity !== 'info') { peersDown++; }
    });
    var devs = {};
    list.forEach(function (e) { if (e.device_id !== null) { devs[e.device_id] = true; } });
    function n(x) { return x ? String(x) : 'none'; }
    var tiles = [
        ['Routes', '--blue', plusMinus(rp, rm)],
        ['Peers down', '--red', esc(n(peersDown))],
        ['LLDP neighbors', '--purple', plusMinus(count(list, function (e) { return e.kind === 'lldp_neighbor_added'; }),
                                               count(list, function (e) { return e.kind === 'lldp_neighbor_removed'; }))],
        ['Interface events', '--cyan', esc(n(count(list, function (e) { return e.type === 'Interface'; })))],
        ['Polling events', '--yellow', esc(n(count(list, function (e) { return e.type === 'Polling'; })))],
        ['Ping events', '--yellow', esc(n(count(list, function (e) { return e.type === 'Ping'; })))],
        ['Devices affected', '--green', esc(n(Object.keys(devs).length))],
        ['Last change', '--gray', esc(list.length ? ago(Date.now() - new Date(list[0].at).getTime()) + ' ago' : 'none')],
    ];
    document.getElementById('tiles').innerHTML = tiles.map(function (t) {
        return '<div class="chg-tile" style="--tile: var(' + t[1] + ')"><div class="k">' + esc(t[0]) +
            '</div><div class="v">' + t[2] + '</div></div>';
    }).join('');
}

// ---- Table ----------------------------------------------------------------------
function render() {
    var list = visibleEvents();
    var html = '';
    for (var i = 0; i < list.length; i++) {
        var e = list[i];
        var note = noteText(e);
        html += '<tr class="row' + (e.id === selectedId ? ' selected' : '') + '" data-ctx="event" data-id="' + e.id +
            '" data-dev="' + (e.device_id === null ? '' : e.device_id) + '">' +
            '<td class="when" data-sort="' + ctxMenu.attr(e.at) + '" title="' + esc(new Date(e.at).toLocaleString()) + '">' + esc(timeCell(e)) + '</td>' +
            '<td>' + esc(deviceName(e)) + '</td>' +
            '<td>' + esc(e.type) + '</td>' +
            '<td>' + (e.change ? '<span class="pill ' + changeClass(e.change) + '">' + esc(e.change) + '</span>' : '') + '</td>' +
            '<td><button type="button" class="linklike" data-id="' + e.id + '">' + esc(subjectText(e)) + '</button></td>' +
            '<td>' + stateCell(e.before) + '</td>' +
            '<td>' + stateCell(e.after) + '</td>' +
            '<td class="notes"><span class="pill ' + sevClass(e.severity) + '">' + esc(e.severity) + '</span>' + esc(note) + '</td></tr>';
    }
    document.getElementById('rows').innerHTML = html;
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
    document.getElementById('count-note').textContent = list.length === events.length
        ? events.length + ' changes' : list.length + ' of ' + events.length + ' changes';
    renderTiles(list);
    setTimeout(reband, 0);   // after tablesort.js has put the rows back in the chosen order
}

// Bands follow the rows as shown: a run of rows from one device keeps one colour, a line marks each new device.
function reband() {
    var rows = document.getElementById('rows').rows;
    var band = false, prev = null;
    for (var i = 0; i < rows.length; i++) {
        var dev = rows[i].getAttribute('data-dev');
        var newDevice = i > 0 && dev !== prev;
        if (newDevice) { band = !band; }
        prev = dev;
        rows[i].classList.toggle('band', band);
        rows[i].classList.toggle('devstart', newDevice);
    }
}

function load() {
    fetch('/api/events?hours=' + encodeURIComponent(val('f-hours')) + '&limit=1000').then(function (r) { return r.json(); }).then(function (list) {
        // Newest first by time (the API orders by id, which is the same on real data).
        events = list.sort(function (a, b) { return new Date(b.at) - new Date(a.at) || b.id - a.id; });
        computeGaps();
        fillFilters();
        render();
        if (selectedId !== null) { if (selectedEvent()) { fillPane(selectedEvent()); } else { closePane(); } }
    });
}

// ---- Details pane ---------------------------------------------------------------
function addRow(parent, key, value) {
    var row = document.createElement('div');
    row.className = 'kv-row';
    var k = document.createElement('span'); k.className = 'k'; k.textContent = key;
    var v = document.createElement('span'); v.className = 'v'; v.textContent = value;
    row.appendChild(k); row.appendChild(v);
    parent.appendChild(row);
}

function fillPane(e) {
    document.getElementById('ep-title').textContent = e.subject;
    document.getElementById('ep-sub').textContent = deviceName(e);
    var info = document.getElementById('ep-info');
    info.textContent = '';
    addRow(info, 'time', new Date(e.at).toLocaleString());
    addRow(info, 'device', deviceName(e));
    addRow(info, 'type', e.type);
    if (e.change) { addRow(info, 'change', e.change); }
    if (e.item) { addRow(info, 'subject', e.item); }
    if (e.before) { addRow(info, 'before', e.before); }
    if (e.after) { addRow(info, 'after', e.after); }
    addRow(info, 'severity', e.severity);
    var gap = gaps[e.id];
    addRow(info, 'since last', gap === null || gap === undefined ? 'no earlier change for this device' : ago(gap));
    addRow(info, 'kind', e.kind);
    addRow(info, 'event id', e.id);
    document.getElementById('ep-detail').textContent = e.detail || '(none)';
    document.getElementById('ep-device').disabled = e.device_id === null;
    document.getElementById('ep-topo').disabled = e.device_id === null;
    document.getElementById('pane').style.display = 'block';
}

function selectEvent(id) {
    var e = findEvent(id);
    if (!e) { return; }
    selectedId = id;
    fillPane(e);
    render();
}

function closePane() {
    selectedId = null;
    document.getElementById('pane').style.display = 'none';
    render();
}

function openDevice(e) { if (e && e.device_id !== null) { window.location.href = '/devices/' + e.device_id; } }
function openTopology(e) { if (e && e.device_id !== null) { window.location.href = '/topology?device=' + e.device_id; } }

document.getElementById('f-hours').addEventListener('change', load);
['f-device', 'f-type', 'f-change', 'f-severity'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', render);
});
document.getElementById('f-q').addEventListener('input', render);
document.querySelector('#table thead').addEventListener('click', function () { setTimeout(reband, 0); });

var rowsBody = document.getElementById('rows');
rowsBody.addEventListener('click', function (ev) {
    var tr = ev.target.closest('tr.row');
    if (tr) { selectEvent(parseInt(tr.getAttribute('data-id'), 10)); }
});

// Right-click menus (static/ctxmenu.js). A row opens the event menu; empty page space opens the page menu.
ctxMenu.register('event', function (tr) {
    var e = findEvent(parseInt(tr.getAttribute('data-id'), 10));
    if (!e) { return null; }
    var filtered = val('f-device') !== '';
    return { title: deviceName(e) + ' | ' + e.subject, items: [
        { label: 'Show details', action: function () { selectEvent(e.id); } },
        { label: 'Open device page', action: function () { openDevice(e); }, disabled: e.device_id === null },
        { label: 'Show on topology', action: function () { openTopology(e); }, disabled: e.device_id === null },
        filtered
            ? { label: 'Show all devices', action: function () { setDeviceFilter(null); } }
            : { label: "Show only this device's changes", action: function () { setDeviceFilter(e.device_id); }, disabled: e.device_id === null },
        { label: 'Copy event text', action: function () {
            ctxMenu.copy(new Date(e.at).toLocaleString() + ' ' + deviceName(e) + ': ' + e.subject + (e.detail ? ' - ' + e.detail : ''));
        } },
    ] };
});

// The whole page counts as one more menu target, so the empty space below the table has a menu too.
// The header, nav and taskbar keep the browser's own menu.
document.documentElement.setAttribute('data-ctx', 'page');
ctxMenu.register('page', function (el, ev) {
    if (ev.target.closest('.header, .side-nav, .taskbar, .dos-menubar, .dos-fkeys, .dos-help, .page-footer')) { return null; }
    return { title: 'Recent changes', items: [
        { label: 'Refresh now', action: load },
        { label: 'Reset filters', action: resetFilters },
        { label: 'Close details', action: closePane, disabled: selectedId === null },
    ] };
});

// Esc closes the details pane, but only when no menu is open (the menu closes on the same key).
document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape' || selectedId === null) { return; }
    var m = document.querySelector('.ctx-menu');
    if (!m || m.style.display !== 'block') { closePane(); }
}, true);

load();
setInterval(load, 15000);
</script>
{% endblock %}
