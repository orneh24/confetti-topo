<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>confetti-topo — Login</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/layout.css">
<script src="/static/theme.js"></script>
</head>
<body>
<div class="container" style="max-width:420px;margin:12vh auto">
    <div class="section">
        <div class="section-header"><span>confetti-topo login</span></div>
        <div class="section-body">
            <form method="post" action="/login">
                <input type="hidden" name="next" value="{{ next }}">
                <div class="kv"><label for="token" class="k">Access token</label></div>
                <input type="password" id="token" name="token" autocomplete="current-password" autofocus style="width:100%;box-sizing:border-box;margin:6px 0 10px">
                <button type="submit" class="primary">Log in</button>
                {% if error %}<span class="msg err" style="margin-left:10px">{{ error }}</span>{% endif %}
            </form>
        </div>
    </div>
</div>
</body>
</html>
